<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Clima & Kafka</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
            max-width: 700px;
            width: 100%;
        }
        h1 { color: #1a202c; font-size: 24px; margin-top: 0; }
        p { color: #4a5568; line-height: 1.5; }
        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #4338ca; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            font-size: 13px;
        }
        .badge {
            background-color: #def7ec;
            color: #03543f;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        pre {
            background-color: #1e293b;
            color: #38bdf8;
            padding: 18px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🌤️ Monitor Meteorológico (Sevilla) y Kafka</h1>
    <p>Visualización del payload JSON que se está enviando dinámicamente al broker de mensajería.</p>
    
    <button class="btn" onclick="fetchNewData()">🔄 Actualizar Ahora</button>

    <div class="status-bar">
        <span class="badge">● Tópico: spain-weather-topic</span>
        <span id="timer-lbl" style="color: #64748b;">Actualizando...</span>
    </div>

    <pre id="json-box" th:text="${initialData}">{}</pre>
</div>

<script th:inline="javascript">
    function fetchNewData() {
        fetch('/api/weather/latest')
            .then(res => res.json())
            .then(data => {
                const prettyJson = JSON.stringify(JSON.parse(data.json), null, 2);
                document.getElementById('json-box').textContent = prettyJson;
                document.getElementById('timer-lbl').textContent = "Último refresco web: " + new Date().toLocaleTimeString();
            })
            .catch(err => console.error("Error obteniendo caché:", err));
    }

    document.addEventListener("DOMContentLoaded", () => {
        try {
            const el = document.getElementById('json-box');
            el.textContent = JSON.stringify(JSON.parse(el.textContent), null, 2);
        } catch(e){}
        document.getElementById('timer-lbl').textContent = "Último refresco web: " + new Date().toLocaleTimeString();
    });

    // Evento recurrente cada 30 segundos (30000ms)
    setInterval(fetchNewData, 30000);
</script>

</body>
</html>
